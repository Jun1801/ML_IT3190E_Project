[project]
name = "ariel-ml"
version = "0.1.0"
description = "ML pipeline for Ariel Data Challenge 2025."
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
]

[project.optional-dependencies]
full = [
    "lightgbm",
    "ngboost",
    "torch",
    "xgboost",
]

[tool.pytest.ini_options]
# src/ is added to sys.path so all modules (config, models, training, …) are importable directly.
pythonpath = ["src"]
testpaths = ["tests"]
